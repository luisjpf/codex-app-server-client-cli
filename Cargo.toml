[package]
name = "codex-app-server-client-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Automation-friendly Rust CLI for Codex app-server WebSocket workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/luisjpf/codex-app-server-client-cli"
homepage = "https://github.com/luisjpf/codex-app-server-client-cli"
documentation = "https://docs.rs/codex-app-server-client-cli"
keywords = ["codex", "cli", "websocket", "json-rpc", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.24"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
